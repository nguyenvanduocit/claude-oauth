# Release — runs whenever a `v*` tag is pushed.
#  1. check:    the tag matches Cargo.toml's version; fmt, clippy and tests pass.
#  2. build:    a binary for each platform (static musl on Linux), packed as
#               claude-oauth-<version>-<target>.tar.gz with LICENSE and README.
#  3. release:  a GitHub Release with the archives, checksums.txt and generated notes.
#  4. homebrew: writes claude-oauth.rb into nguyenvanduocit/homebrew-tap.
#
# The tap is written with an SSH deploy key (secret HOMEBREW_TAP_DEPLOY_KEY) that can
# push to that one repository only. GITHUB_TOKEN cannot reach another repository.
# Every action is pinned by SHA.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: claude-oauth-${{ needs.check.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: target/${{ matrix.target }}/release/claude-oauth --version
      - name: Package
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/claude-oauth" LICENSE README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "claude-oauth $VERSION" --generate-notes --verify-tag $prerelease \
            ./*.tar.gz checksums.txt

  homebrew:
    needs: [check, release]
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write the formula
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sum() { cut -d' ' -f1 "dist/claude-oauth-$VERSION-$1.tar.gz.sha256"; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          cat > claude-oauth.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          # Written by the claude-oauth release workflow. DO NOT EDIT.
          class ClaudeOauth < Formula
            desc "Manage Claude Code OAuth tokens across accounts and run Claude with any of them"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$base/claude-oauth-$VERSION-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              else
                url "$base/claude-oauth-$VERSION-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "$base/claude-oauth-$VERSION-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-musl)"
              elsif Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "$base/claude-oauth-$VERSION-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "claude-oauth"
            end

            def caveats
              <<~EOS
                claude-oauth runs Claude Code, which is installed separately:
                  https://docs.claude.com/en/docs/claude-code
              EOS
            end

            test do
              assert_match "claude-oauth #{version}", shell_output("#{bin}/claude-oauth --version")
            end
          end
          RUBY
          cat claude-oauth.rb
      - name: Push to nguyenvanduocit/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:nguyenvanduocit/homebrew-tap.git tap
          cp claude-oauth.rb tap/claude-oauth.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-oauth.rb
          if git diff --cached --quiet; then echo "Formula unchanged."; exit 0; fi
          git commit -m "Brew formula update for claude-oauth version v$VERSION"
          git push origin HEAD:main
