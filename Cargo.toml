[package]
name = "claude-oauth"
version = "0.2.0"
edition = "2024"
description = "Manage Claude Code OAuth tokens for several Claude accounts and run Claude Code with any of them."
license = "MIT"
repository = "https://github.com/nguyenvanduocit/claude-oauth"
readme = "README.md"
keywords = ["claude", "claude-code", "oauth", "cli"]
categories = ["command-line-utilities"]

[dependencies]
tempfile = "3.27.0"
aes-gcm = "0.10"
anyhow = "1.0.105"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = "3.5.3"
libc = "0.2.191"
nix = { version = "0.32", features = ["term", "process", "signal", "fs"] }
process-wrap = { version = "11", default-features = false, features = ["std", "kill-on-drop", "process-group", "process-session", "reset-sigmask"] }
rand = "0.8"
regex = "1.13.2"
rpassword = "7.5.5"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
signal-hook = "0.3"
ureq = { version = "2", features = ["json"] }
url = "2.5.9"
zeroize = "1.9.2"


# scrypt is slow unoptimised; keep debug builds and tests quick.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
